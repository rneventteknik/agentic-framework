name: stagehand-qvack

services:
  stagehand-qvack:
    image: ghcr.io/rneventteknik/stagehand-qvack:main
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY
      - BACKSTAGE2_MCP_URL
      - BACKSTAGE2_MCP_KEY
      - SLACK_BOT_TOKEN
      - SLACK_APP_TOKEN
      - LOG_LEVEL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
