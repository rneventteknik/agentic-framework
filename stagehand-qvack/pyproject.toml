[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stagehand-qvack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "slack-sdk==3.45.0",
    "slack-bolt==1.30.0",
    "slack-cli-hooks==0.3.0",
    "pydantic-ai==2.64.0",
    "python-dotenv==1.2.4",
    "tzdata",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
include = ["agent*", "listeners*", "thread_context*"]

[tool.ruff]
[tool.ruff.lint]
[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
